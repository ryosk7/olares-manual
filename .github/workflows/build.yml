name: Build manual PDF

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Render PDFs with headless Chrome
        run: |
          render() {
            google-chrome --headless=new --disable-gpu --no-sandbox --no-pdf-header-footer \
              --print-to-pdf="$PWD/$2" "file://$PWD/$1"
            test -s "$2"
          }
          render manual.html olares-manual.pdf
          render voice-input.html olares-voice-input.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: olares-manual
          path: |
            olares-manual.pdf
            olares-voice-input.pdf

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" olares-manual.pdf olares-voice-input.pdf \
            --title "Olares マニュアル $GITHUB_REF_NAME" \
            --notes-file <(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
